name: Paper Regression Workflow

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  paper-regression:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,moga]

      - name: Verify Paper Pipeline with Complete Temporary Manifests
        run: |
          python -m pytest -v tests/test_publication_inputs.py::test_pipeline_in_fresh_python_process tests/test_publication_validation_build.py::test_explicit_complete_baseline_override_generates_paper

      - name: Run Paper Regression Test Suite
        run: |
          pytest -v tests/test_paper_regression.py
