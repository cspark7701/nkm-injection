name: Release & Zenodo Archival

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,moga]

      - name: Run Full Test Suite
        run: |
          pytest -v

      - name: Run Single-Command Paper Reproduction
        run: |
          python3 scripts/reproduce_paper.py

      - name: Verify Protected Input File Hashes
        run: |
          python3 -c "
          from pathlib import Path
          from src.nkm_injection.results_schema import compute_input_data_hashes
          hashes = compute_input_data_hashes(Path('.'))
          print('Input File Cryptographic Hashes:')
          for name, h in hashes.items():
              print(f'  {name}: {h}')
          "
