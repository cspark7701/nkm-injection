name: Release & Zenodo Archival

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  verify-and-release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Set up Python 3.11
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev,moga]

      - name: Run Full Test Suite
        run: |
          python -m pytest -v

      - name: Verify Paper Pipeline with Complete Temporary Manifests
        run: |
          python -m pytest -v tests/test_publication_inputs.py::test_pipeline_in_fresh_python_process tests/test_publication_validation_build.py::test_explicit_complete_baseline_override_generates_paper

      - name: Verify Protected Input File Hashes
        run: |
          python3 -c "
          from pathlib import Path
          from nkm_injection.results_schema import compute_input_data_hashes
          hashes = compute_input_data_hashes(Path('.'))
          print('Input File Cryptographic Hashes:')
          for name, h in hashes.items():
              print(f'  {name}: {h}')
          "
